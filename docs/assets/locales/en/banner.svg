<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14"/>
      <stop offset="50%" stop-color="#0c1222"/>
      <stop offset="100%" stop-color="#080c18"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.3"/>
    </pattern>

    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Chassis -->
  <rect width="900" height="240" rx="14" fill="url(#bgGrad)"/>
  <rect width="900" height="240" rx="14" fill="url(#grid)"/>
  <rect x="1" y="1" width="898" height="238" rx="13" fill="none" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Glowing Ambiance Orbs -->
  <circle cx="120" cy="120" r="80" fill="#38bdf8" opacity="0.12" filter="blur(40px)"/>
  <circle cx="780" cy="130" r="85" fill="#a855f7" opacity="0.12" filter="blur(45px)"/>

  <!-- Left Ring Buffer Icon Schematic -->
  <g transform="translate(65, 55)">
    <!-- Outer Submission Ring -->
    <circle cx="65" cy="65" r="50" fill="none" stroke="#1e3a5f" stroke-width="2"/>
    <circle cx="65" cy="65" r="50" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="35 15" stroke-dashoffset="10"/>

    <!-- Inner Completion Ring -->
    <circle cx="65" cy="65" r="32" fill="none" stroke="#3b1f54" stroke-width="2"/>
    <circle cx="65" cy="65" r="32" fill="none" stroke="#c084fc" stroke-width="2" stroke-dasharray="25 10"/>

    <!-- Center Core Dot -->
    <circle cx="65" cy="65" r="10" fill="#0f172a" stroke="#34d399" stroke-width="2" filter="url(#neon-glow)"/>
    <circle cx="65" cy="65" r="4" fill="#34d399"/>

    <!-- Orbit Nodes -->
    <circle cx="65" cy="15" r="4" fill="#38bdf8" filter="url(#neon-glow)"/>
    <circle cx="115" cy="65" r="4" fill="#c084fc" filter="url(#neon-glow)"/>
    <circle cx="65" cy="115" r="4" fill="#38bdf8" filter="url(#neon-glow)"/>
    <circle cx="15" cy="65" r="4" fill="#34d399" filter="url(#neon-glow)"/>
  </g>

  <!-- Content Group -->
  <g transform="translate(230, 42)">
    <!-- Top System Badges -->
    <g>
      <!-- Chip 1: C23 -->
      <rect x="0" y="0" width="150" height="24" rx="6" fill="#0f1f2e" stroke="#1e3a5f" stroke-width="1"/>
      <circle cx="12" cy="12" r="3" fill="#38bdf8" filter="url(#neon-glow)"/>
      <text x="22" y="15.5" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">C23 KERNEL ENGINE</text>

      <!-- Chip 2: 2.85 Mops -->
      <rect x="160" y="0" width="145" height="24" rx="6" fill="#0f261e" stroke="#065f46" stroke-width="1"/>
      <circle cx="172" cy="12" r="3" fill="#34d399" filter="url(#neon-glow)"/>
      <text x="182" y="15.5" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">2.85 MOPS/SEC</text>

      <!-- Chip 3: SQPOLL -->
      <rect x="315" y="0" width="230" height="24" rx="6" fill="#201130" stroke="#581c87" stroke-width="1"/>
      <circle cx="327" cy="12" r="3" fill="#c084fc" filter="url(#neon-glow)"/>
      <text x="337" y="15.5" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">SQPOLL ZERO-SYSCALL</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="70" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5">
      ring-io
    </text>

    <!-- Subtitle -->
    <text x="0" y="105" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="500">
      High-Throughput Asynchronous I/O Engine via Linux io_uring
    </text>

    <!-- Footer Specs -->
    <text x="0" y="138" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500">
      Linux 5.10+ · Lock-Free Submission/Completion Rings · Zero Copy · MIT License
    </text>
  </g>
</svg>